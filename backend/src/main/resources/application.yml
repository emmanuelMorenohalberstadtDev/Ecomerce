spring:
  application:
    name: ecommerce-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, always (ADR-0001)
    open-in-view: false     # mandatory: no lazy loading during rendering
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

server:
  error:
    include-stacktrace: never
    include-message: never
