spring:
  application:
    name: ecommerce-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Minimum 32 characters (256 bits) required for HS256. Injected from JWT_SECRET env var.
  # No default — a missing secret fails startup loudly (security §5.1).
  secret: ${JWT_SECRET}
  # Access token TTL in minutes. Security §6b specifies 10 minutes.
  access-token-expiry-minutes: 10

checkout:
  # The 15-minute payment window (domain-model.md §1/§5 "Payment window", rules 5/8).
  # ISO-8601 duration; overridable per environment.
  payment-window: PT15M

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
