# nginx configuration — ecommerce SPA + API reverse proxy
# Security header values: baseline per deployment-architecture §5.
# Final CSP / rate-limit values blocked on security-engineer checklist (§5.2).

# ── Logging format: includes request time + upstream time ─────────────────────
# Allows performance-engineer to attribute latency (edge vs backend).
log_format main_ext '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

# ── Rate limiting zones ────────────────────────────────────────────────────────
# Tight limit on auth endpoints; values to be confirmed by security-engineer.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log main_ext;
    error_log  /var/log/nginx/error.log warn;

    # ── Body size limit ──────────────────────────────────────────────────────
    client_max_body_size 5m;

    # ── Security headers (baseline) ──────────────────────────────────────────
    # Full header set per security-architecture §5.2 — applied here, owned there.
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-Frame-Options          "DENY"                             always;
    add_header X-XSS-Protection         "1; mode=block"                    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    # HSTS — enabled once TLS termination decision is confirmed (§open-dependencies).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP placeholder — final value blocked on security-engineer §5.2 review.
    # add_header Content-Security-Policy "default-src 'self'; ..." always;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Health probe — exact match, no SPA fallback ───────────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── robots.txt — exact match ──────────────────────────────────────────────
    location = /robots.txt {
        log_not_found off;
        access_log    off;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # Auth endpoints get tight rate limiting.
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        # CORS is owned by Spring Security — never duplicated here.
    }

    # General API traffic.
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # ── Hashed build assets — immutable cache ─────────────────────────────────
    # Angular outputs files with content hashes in names (e.g., main.abc123.js).
    # These never change content, so 1-year immutable cache is safe.
    location ~* \.[0-9a-f]{8,}\.(js|css|woff2?|ttf|eot|otf|png|jpg|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Do not fall through to SPA — missing hashed asset = 404, not index.html.
        try_files $uri =404;
        access_log off;
    }

    # ── SPA catch-all ────────────────────────────────────────────────────────
    # index.html must never be cached — users must get new deployments immediately.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
